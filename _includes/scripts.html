<script>
  // 1. CAROUSEL FUNCTIONS
  function scrollCarousel(button, direction) {
    const wrapper = button.closest('.carousel-wrapper');
    const track = wrapper.querySelector('.carousel-track');
    const slides = Array.from(track.querySelectorAll('.carousel-slide'));
    if (!slides.length) return;

    const activeSlide = getActiveSlide(wrapper);
    if (!activeSlide) return;

    const currentIndex = slides.indexOf(activeSlide);
    const targetIndex = Math.min(Math.max(currentIndex + direction, 0), slides.length - 1);
    const targetSlide = slides[targetIndex];
    if (!targetSlide) return;

    track.scrollTo({
      left: targetSlide.offsetLeft,
      behavior: 'smooth'
    });
  }

  function applyMarquee(wrap) {
    const textEl = wrap.querySelector('.caption-text');
    wrap.classList.remove('marquee');
    const original = textEl.dataset.original;
    textEl.textContent = original;
    if (textEl.scrollWidth > wrap.clientWidth) {
      textEl.textContent = original + '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0' + original;
      wrap.classList.add('marquee');
    }
  }

  function getActiveSlide(wrapper) {
    const track = wrapper.querySelector('.carousel-track');
    const slides = Array.from(track.querySelectorAll('.carousel-slide'));
    if (!slides.length) return null;

    const scrollCenter = track.scrollLeft + track.clientWidth / 2;
    let activeSlide = slides[0];
    let closestDistance = Infinity;

    slides.forEach(slide => {
      const slideCenter = slide.offsetLeft + slide.offsetWidth / 2;
      const distance = Math.abs(slideCenter - scrollCenter);
      if (distance < closestDistance) {
        closestDistance = distance;
        activeSlide = slide;
      }
    });

    return activeSlide;
  }

  function updateCaption(wrapper) {
    const activeSlide = getActiveSlide(wrapper);
    if (!activeSlide) return;

    const wrap = wrapper.querySelector('.caption-text-wrap');
    const textEl = wrap.querySelector('.caption-text');
    textEl.dataset.original = activeSlide.dataset.caption || '';
    applyMarquee(wrap);
  }

  function setWrapperHeight(wrapper) {
    // No-op: let the images and slides determine their own height to avoid cropping.
    // Previously this function forced an inline height on the wrapper which caused
    // images with different aspect ratios to be clipped. Setting `height: auto`
    // here prevents the script from overriding natural image sizing.
    if (wrapper) wrapper.style.height = 'auto';
  }

  function initCarousels() {
    document.querySelectorAll('.carousel-wrapper').forEach(wrapper => {
      const track = wrapper.querySelector('.carousel-track');
      // initialize caption and wrapper height
      updateCaption(wrapper);
      setWrapperHeight(wrapper);

      let scrollTimeout;
      track.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          updateCaption(wrapper);
          setWrapperHeight(wrapper);
        }, 120);
      });
    });
  }

  window.addEventListener('load', initCarousels);
  window.addEventListener('resize', () => {
    document.querySelectorAll('.carousel-wrapper').forEach(wrapper => {
      updateCaption(wrapper);
      setWrapperHeight(wrapper);
    });
  });

  // 2. LIGHTBOX & PROTECTION FUNCTIONS
  function openModal(imgSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    modalImg.src = imgSrc;
    modal.classList.add('open');
  }

  function closeModal() {
    const modal = document.getElementById('imageModal');
    modal.classList.remove('open');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  document.addEventListener('DOMContentLoaded', () => {
    const galleryImages = document.querySelectorAll('.carousel-slide img');
    const allImages = document.querySelectorAll('img');

    galleryImages.forEach(img => {
      img.addEventListener('click', () => openModal(img.src));
      img.addEventListener('load', () => {
        const wrapper = img.closest('.carousel-wrapper');
        if (wrapper) setWrapperHeight(wrapper);
      });
    });

    allImages.forEach(img => {
      img.addEventListener('contextmenu', (e) => e.preventDefault());
      img.addEventListener('dragstart', (e) => e.preventDefault());
    });
  });
</script>
